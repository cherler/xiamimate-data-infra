services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xiamimate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xiamimate
      POSTGRES_USER: xiamimate
      POSTGRES_PASSWORD: xiamimate
    ports:
      - "5432:5432"
    volumes:
      - ${XIAMIMATE_POSTGRES_DATA_DIR:-./pgdata}:/var/lib/postgresql/data
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./init_sync_tables.sql:/docker-entrypoint-initdb.d/002-sync-tables.sql:ro

  # ---------- Metabase: 数据探索看板 ----------
  metabase:
    image: metabase/metabase:latest
    container_name: xiamimate-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: xiamimate
      MB_DB_PORT: 5432
      MB_DB_USER: xiamimate
      MB_DB_PASS: xiamimate
      MB_DB_HOST: postgres
    depends_on:
      - postgres
    volumes:
      - metabase_data:/metabase-data

  # ---------- Grafana: 采集监控看板 ----------
  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: xiamimate-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: xiamimate
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

volumes:
  metabase_data:
    name: ${XIAMIMATE_METABASE_VOLUME_NAME:-postgres_metabase_data}
  grafana_data:
    name: ${XIAMIMATE_GRAFANA_VOLUME_NAME:-postgres_grafana_data}